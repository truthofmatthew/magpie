name: Magpie
options:
  bundleIdPrefix: com.truthofmatthew
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 3GHX277DW6
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
targets:
  Magpie:
    type: application
    platform: macOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Magpie
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.truthofmatthew.Magpie
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MagpieTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Magpie
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Magpie.app/Contents/MacOS/Magpie
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Magpie:
    build:
      targets:
        Magpie: all
        MagpieTests: [test]
    test:
      targets: [MagpieTests]
