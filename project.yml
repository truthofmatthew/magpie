name: Clipboard
options:
  bundleIdPrefix: com.truthofmatthew
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 3GHX277DW6
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
targets:
  Clipboard:
    type: application
    platform: macOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Clipboard
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.truthofmatthew.Clipboard
        ENABLE_HARDENED_RUNTIME: YES
  ClipboardTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Clipboard
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Clipboard.app/Contents/MacOS/Clipboard
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Clipboard:
    build:
      targets:
        Clipboard: all
        ClipboardTests: [test]
    test:
      targets: [ClipboardTests]
